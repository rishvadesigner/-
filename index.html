<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishva Designer - Order Form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">.
        <div class="logo-container">
    <img src="logo.png" alt="Brand Logo" class="logo">
</div>
        <!-- Order Form Page -->
        <div id="orderFormPage" class="order-form-page">
           <center><h1>Rishva Designer</h1></center> 
            <p class="subtitle">Custom Clothing Measurements</p>

            <form id="orderForm">
                <div class="form-section">
                    <h2>Customer Details</h2>
                    <div class="form-group">
                        <label for="customerName">Full Name *</label>
                        <input type="text" id="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">Phone Number *</label>
                        <input type="tel" id="customerPhone" required>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Clothing Type</h2>
                    <div class="form-group">
                        <label for="clothingType">Select Type *</label>
                        <select id="clothingType" required>
    <option value="">-- Select Clothing Type --</option>
    <option value="kurti">Kurti</option>
    <option value="pant">Pant</option>
    <option value="gown">Gown</option>
    <option value="lehenga">Lehenga</option>
    <option value="blouse">Blouse</option>
    <option value="jacket">Jacket</option>
    <option value="kaftan">Kaftan</option>
    <option value="other">Other</option>
</select>

<!-- Add this just below select -->
<input type="text" id="otherTypeInput" placeholder="Enter clothing type" style="display:none; margin-top:10px;">
                    </div>
                </div>

                <div id="measurementsSection" class="form-section">
                    <h2>Body Measurements (in inches)</h2>
                    <div id="measurementsFields"></div>
                </div>
<div class="form-group">
    <label for="notes">Notes (Optional)</label>
    <textarea id="notes" rows="3" placeholder="Add any special instructions..."></textarea>
</div>
                <button type="submit">Save Order</button>
            </form>

            <button type="button" class="view-measurements-btn" id="viewMeasurementsBtn">View Measurements</button>

            <div class="success-message" id="successMessage">
                Order saved successfully! ✓
            </div>
        </div>

        <!-- Measurements Page -->
        <div id="measurementsPage" class="measurements-page">
            <button type="button" class="back-btn" id="backBtn">← Back to Form</button>
            
            <h1>Saved Measurements</h1>
            <input type="text" id="searchInput" placeholder="Search by name or phone..." style="margin-bottom:15px;">
            <p class="subtitle">All Customer Orders</p>

            <div id="ordersList"></div>
        </div>

        <!-- Password Modal -->
        <div class="password-modal" id="passwordModal">
            <div class="password-box">
                <h3>Enter Password</h3>
                <input type="password" class="password-input" id="passwordInput" placeholder="Enter password">
                <div class="password-buttons">
                    <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
                    <button type="button" id="submitPasswordBtn">Submit</button>
                </div>
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 Your Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDr10gyz4RdkIpfw8F030Tmsgx0EJ12hjg",
  authDomain: "rishva-designer.firebaseapp.com",
  projectId: "rishva-designer",
  storageBucket: "rishva-designer.firebasestorage.app",
  messagingSenderId: "993447259894",
  appId: "1:993447259894:web:1ad99e5e2cf4d7e198c6d7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// make globally available
window.db = db;
window.fb = { collection, addDoc, getDocs, deleteDoc, doc };
</script>

<script type="module" src="script.js"></script>    
</body>
</html>
